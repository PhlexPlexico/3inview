name: release

on:
  push:
    tags: ["v*"]          # git tag v0.1.0 && git push --tags  -> builds and publishes a release
  workflow_dispatch:      # manual run from the Actions tab: builds and uploads artifacts, no release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest   # Bun cross-compiles every target from one Linux machine
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13   # the version this was developed with; bump deliberately

      - run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Build executables
        run: bun run dist

      - name: Package
        working-directory: dist
        run: |
          # tar keeps the executable bit, which a plain download of the binary would lose.
          for f in 3inview-linux-x64 3inview-linux-arm64 3inview-macos-arm64 3inview-macos-x64; do
            tar -czf "$f.tar.gz" "$f" && rm "$f"
          done
          zip 3inview-windows-x64.zip 3inview-windows-x64.exe && rm 3inview-windows-x64.exe
          sha256sum ./* > SHA256SUMS.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: 3inview-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 3inview-${{ github.ref_name }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
