<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3inview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: transparent; font-family: system-ui, sans-serif; }
  #stage { transform-origin: top left; width: 700px; }
  #skin { width: 700px; height: 360px; display: block; }
  .shell  { fill: var(--shell, #2b2d33); stroke: #55585f; stroke-width: 3; }
  .shell.dark { fill: #1c1d21; }
  .screen { fill: var(--screen, #1eff00); stroke: #44474d; stroke-width: 2; }
  .well   { fill: #1a1b1f; stroke: #44474d; stroke-width: 2; }
  .nub    { fill: #50545c; stroke: #8a8f99; stroke-width: 2; }
  .btn    { fill: #3b3e46; stroke: #70747d; stroke-width: 2; }
  .pressed { fill: #ff4f5a !important; stroke: #ffd0d3 !important; }
  .touch  { fill: #3aa0ff; stroke: #fff; stroke-width: 2; }
  .lbl    { fill: #c9ccd2; font-size: 14px; pointer-events: none; user-select: none; }
  .lbl.small { font-size: 9px; } .lbl.dim { fill: #5b5f68; }
  #hud { position: static; display: inline-block; margin: 6px 0 0 8px; color: #dfe3ea; font: 12px/1.35 ui-monospace, monospace;
         background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; max-width: 360px; white-space: pre-wrap; }
  #hud.hidden { display: none; }
  #conn { font-weight: bold; }
  #ipbox { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); background: rgba(20,21,25,.95);
           color: #dfe3ea; padding: 14px 16px; border-radius: 10px; border: 1px solid #55585f; font: 14px system-ui, sans-serif;
           display: flex; flex-direction: column; gap: 8px; width: 260px; }
  #ipbox[hidden] { display: none; }
  #ipbox input { font: 15px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; border: 1px solid #70747d; background: #0d0e10; color: #fff; }
  #ipbox button { padding: 6px; border-radius: 6px; border: 0; background: #3aa0ff; color: #fff; font-weight: 600; cursor: pointer; }
  #ipbox small { color: #9aa0ab; } #iperr { color: #ff7a85; min-height: 1em; font-size: 12px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud"><span id="conn">Connecting...</span>
<span id="info"></span></div>
  <form id="ipbox" hidden>
    <label for="ipinput">3DS IP address</label>
    <input id="ipinput" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="192.168.1.50">
    <button type="submit">Connect</button>
    <div id="iperr"></div>
    <small>Shown by the Launcher on your 3DS.</small>
  </form>
  <script type="module" src="/main.js"></script>
</body>
</html>
